# Ported from legacy/configs/config.yaml.
# The kafka section, the *_JAR paths and pipeline.run_id are gone: the Kafka stage is deferred,
# Maven owns the classpath under Flink 2.2.1, and run ids are generated per execution now.
#
# Paths below are relative to backend/, the directory the job runs from.

dataset:
  target_dataset: "tweet_hashtag"

  # Where POST /datasets puts uploaded csvs. Relative to backend/, like every other path here.
  uploads_dir: "../data/uploads"

  # Uploads older than this get collected by DatasetRepository.deleteExpired(). Zero means keep
  # uploads forever, so nothing is deleted until something calls it on a schedule.
  upload_ttl_days: 0

  tweet_hashtag:
    description: "Generated tweets dataset from script"
    file: "../data/raw/tweet_hashtag.csv"

  nyc_taxi:
    description: "NYC Taxi dataset (future)"
    file: null

  nexmark:
    description: "Nexmark benchmark (future)"
    file: null

flink:
  parallelism: 1

pipeline:
  window_size_seconds: 60
  batch_size: 100
  duckdb_file: "../data/attribution.duckdb"
