[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fyp-attribution"
version = "0.1.0"
description = "Demonstration and Evaluation of How-Much Provenance in Streaming Dataflows"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.11"
authors = [
    {name = "Kalifa Flink"},
    {name = "Student B"}
]
dependencies = [
    # Core streaming
    "confluent-kafka>=2.3.0",
    "apache-flink>=1.18.0",
    
    # Database
    "duckdb>=1.0.0",
    
    # Dashboard
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    
    # Data processing
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0",
    
    # Data validation and typing
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Logging
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src/fyp_attribution --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
