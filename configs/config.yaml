dataset:
  target_dataset: "tweet_hashtag"

  tweet_hashtag:
    description: "Generated tweets dataset from script"
    file: "data/raw/tweet_hashtag.csv"

  nyc_taxi:
    description: "NYC Taxi dataset (future)"
    file: null

  nexmark:
    description: "Nexmark benchmark (future)"
    file: null

kafka:
  bootstrap_servers: "localhost:9092"
  topic: "tweets_input"
  producer:
    batch_size: 100
    linger_ms: 5
    replay_speed: 0.1

flink:
  mode: 1
  parallelism: 1
  checkpoint_interval: 10000
  window_size_seconds: 60

pipeline:
  run_id: "run-001"
  window_size_seconds: 60